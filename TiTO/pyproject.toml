[build-system]
requires = ["setuptools>=84.2.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tito"
version = "0.1.0"
description = "TiTO - Queue-basierter Optimizer für Schichtplanung mit OR-Tools"
authors = [{name = "MVIT"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4"
]

[project.optional-dependencies]
testing = ["pytest", "pytest-cov"]
optimization = ["ortools>=9.15"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tito*"]
