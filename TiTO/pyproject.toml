[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tito"
version = "0.1.0"
description = "TiTO - Queue-basierter Optimizer für Schichtplanung mit OR-Tools"
authors = [{name = "MVIT"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "python-dotenv>=1.0"
]

[project.optional-dependencies]
testing = ["pytest", "pytest-cov"]
optimization = ["or-tools"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tito*"]
