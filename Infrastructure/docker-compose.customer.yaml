# Per-customer deployment stack for PlanBar.
# Connects to the shared PostgreSQL instances from docker-compose.infra.yaml.
#
# Usage:
#   export CUSTOMER=kunde1 FRONTEND_PORT=8081 TITO_PORT=5001 BACKEND_PORT=8001
#   export PLANBAR_DB_NAME=kunde1_planbar TITO_DB_NAME=kunde1_tito
#   export DOMAIN=kunde1.app.planbar.de
#   export PLANBAR_DB_PASSWORD=<pwd> TITO_DB_PASSWORD=<pwd>
#   export SECRET_KEY=<random> TITO_API_KEY=<random> TITO_JWT_SECRET=<random>
#   docker compose -f docker-compose.customer.yaml -p "planbar-${CUSTOMER}" up -d

services:
  tito:
    image: ghcr.io/marv1101/mvit-planbar/tito:latest
    pull_policy: always
    ports:
      - "127.0.0.1:${TITO_PORT}:5001"
    environment:
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgresql://tito:${TITO_DB_PASSWORD:?}@db_tito:5432/${TITO_DB_NAME:?}
      QUEUE_TABLE: job_queue
      CALLBACK_QUEUE: callback_queue
      MAX_JOBS: 20
      TIMEOUT_SECONDS: 300
      API_TOKEN: ${TITO_API_KEY:?}
      JWT_SECRET: ${TITO_JWT_SECRET:?}
      JWT_ALGORITHM: HS256
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - planbar_shared

  tito_worker:
    image: ghcr.io/marv1101/mvit-planbar/tito-worker:latest
    pull_policy: always
    deploy:
      mode: replicated
      replicas: 2
    environment:
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgresql://tito:${TITO_DB_PASSWORD:?}@db_tito:5432/${TITO_DB_NAME:?}
      API_URL: http://tito:5001
      API_TOKEN: ${TITO_API_KEY:?}
      QUEUE_TABLE: job_queue
      CALLBACK_QUEUE: callback_queue
      MAX_JOBS: 10
      TIMEOUT_SECONDS: 300
    restart: unless-stopped
    networks:
      - planbar_shared

  planbar_backend:
    image: ghcr.io/marv1101/mvit-planbar/backend:latest
    pull_policy: always
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    environment:
      TZ: ${TZ:-UTC}
      DATABASE_URL: postgresql://planbar:${PLANBAR_DB_PASSWORD:?}@db_planbar:5432/${PLANBAR_DB_NAME:?}
      SECRET_KEY: ${SECRET_KEY:?}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10
      REFRESH_TOKEN_EXPIRE_DAYS: 90
      TITO_API_URL: http://tito:5001
      TITO_API_KEY: ${TITO_API_KEY:?}
      BACKEND_CALLBACK_URL: https://${DOMAIN:?}/api/v1
      CORS_ORIGINS: https://${DOMAIN:?}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - planbar_shared

  planbar_frontend:
    image: ghcr.io/marv1101/mvit-planbar/frontend:latest
    pull_policy: always
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      TZ: ${TZ:-UTC}
      BACKEND_URL: http://planbar_backend:8000
    depends_on:
      planbar_backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - planbar_shared

networks:
  planbar_shared:
    external: true
