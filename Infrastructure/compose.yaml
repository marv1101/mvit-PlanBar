version: '3.8'

services:
  # TiTO Application Service
  tito:
    build:
      context: ../TiTO
      dockerfile: Dockerfile
    ports:
      - "8000:5001"
    env_file:
    - .env
    environment:
      - DATABASE_URL=postgresql://tito:${TITO_DB_PASSWORD}@db:5432/tito
      - QUEUE_TABLE=job_queue
      - CALLBACK_QUEUE=callback_queue
      - MAX_JOBS=10
      - TIMEOUT_SECONDS=300
      - SCHEMA_VERSION=1.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../TiTO:/app
      - ../TiTO/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tito
      - POSTGRES_PASSWORD=${TITO_DB_PASSWORD}
      - POSTGRES_DB=tito
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: