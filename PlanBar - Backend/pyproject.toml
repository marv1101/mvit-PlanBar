[project]
name = "planbar-backend"
version = "0.1.0"
description = "PlanBar backend API for scheduling and TiTO integration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.urls]
home = "https://example.com/planbar-backend"

dependencies = [
    "fastapi>=0.114.0",
    "uvicorn>=0.24.0",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.0",
    "PyJWT>=2.8.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=1.1.0",
    "email-validator>=1.3.1",
]

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
testing = [
    "pytest>=8.0",
    "pytest-asyncio>=0.22",
    "pytest-cov>=4.0",
    "httpx>=0.26.0",
    "coverage>=7.0"
]

[project.scripts]
planbar-backend = "app.main:app"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --cov=src --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
